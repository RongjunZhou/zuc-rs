[package]
name = "zuc"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "ZUC encryption algorithm implementation with web service and file encryption capabilities"
license = "MIT"

[dependencies]
actix-multipart = "0.6.1"
actix-web = { version = "4", features = ["openssl"] }
des = "0.8.1"
futures = "0.3.30"
openssl = { version = "0.10" }
rc4 = "=0.1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tokio-test = "0.4"